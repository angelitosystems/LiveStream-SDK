# Compila, prueba y publica el SDK de plugins de LiveStream.
#   - Al subir un tag v*: genera la distribución y publica la release del tag con las notas de CHANGELOG.md
#     (si la release ya existe, reemplaza sus archivos).
#   - Manual (workflow_dispatch): solo compila y deja los archivos como artefactos del workflow, para probar.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # crear/actualizar la release

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pruebas
        run: dotnet test tests/LiveStream.SdkSetup.Tests -c Release --nologo

      - name: Ejemplo compilable y válido
        run: dotnet build -c Release --nologo

      - name: Empaquetar
        run: ./scripts/package.ps1

      - name: Guardar la distribución
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: artifacts/release/

      - name: Adjuntar a la release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $files = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($existing -contains $tag) {
            gh release upload $tag $files --clobber
          } else {
            ./scripts/release-notes.ps1 -Version $version -Output "$env:RUNNER_TEMP/notes.md" -Repository $env:GITHUB_REPOSITORY
            gh release create $tag $files --verify-tag --latest --title "LiveStream Plugin SDK $version" --notes-file "$env:RUNNER_TEMP/notes.md"
          }
          if ($LASTEXITCODE) { throw 'No se pudo publicar la release.' }
